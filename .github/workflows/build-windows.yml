name: Build Native Windows App

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate package-lock.json if deleted
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: restore package-lock.json [skip ci]" || echo "No changes to commit"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Synchronize Version
        run: node .github/scripts/sync-version.js

      - name: Prepare Windows Binaries (yt-dlp and ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/bin"
          
          # Download yt-dlp.exe
          Write-Host "Downloading latest yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri/bin/yt-dlp.exe"

          # Download static ffmpeg essentials build for Windows
          Write-Host "Downloading ffmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if ($ffmpegExe) {
            Copy-Item $ffmpegExe.FullName "src-tauri/bin/ffmpeg.exe"
            Write-Host "FFmpeg extracted successfully."
          }

      - name: Build Web Frontend
        run: npm run build

      - name: Build Native Windows App (Tauri)
        run: npx tauri build

      - name: Bundle Standalone Binaries and Portable Package
        shell: pwsh
        run: |
          # Copy yt-dlp.exe and ffmpeg.exe next to the standalone binary
          if (Test-Path "src-tauri/bin/yt-dlp.exe") {
            Copy-Item "src-tauri/bin/yt-dlp.exe" "src-tauri/target/release/yt-dlp.exe" -Force
          }
          if (Test-Path "src-tauri/bin/ffmpeg.exe") {
            Copy-Item "src-tauri/bin/ffmpeg.exe" "src-tauri/target/release/ffmpeg.exe" -Force
          }
          
          # Create a standalone self-contained portable zip (with yt-dlp & ffmpeg bundled)
          New-Item -ItemType Directory -Force -Path "portable-build-full"
          Copy-Item "src-tauri/target/release/yt-dlp-client.exe" "portable-build-full/"
          Copy-Item "src-tauri/bin/yt-dlp.exe" "portable-build-full/"
          Copy-Item "src-tauri/bin/ffmpeg.exe" "portable-build-full/"
          Compress-Archive -Path "portable-build-full/*" -DestinationPath "src-tauri/target/release/yt-dlp-client-portable-full-windows-x64.zip" -Force

      - name: Upload Windows Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-Client-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/yt-dlp-client.exe
            src-tauri/target/release/yt-dlp.exe
            src-tauri/target/release/ffmpeg.exe
            src-tauri/target/release/*.zip
          if-no-files-found: warn

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/yt-dlp-client.exe
            src-tauri/target/release/yt-dlp.exe
            src-tauri/target/release/ffmpeg.exe
            src-tauri/target/release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
