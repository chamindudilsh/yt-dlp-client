name: Build Native Windows App

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate package-lock.json if deleted
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: restore package-lock.json [skip ci]" || echo "No changes to commit"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Synchronize Version
        run: node .github/scripts/sync-version.js

      - name: Ensure Bin Directory Exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/bin"

      - name: Synchronize Application Icons
        run: npx tauri icon icon.png

      - name: Build Web Frontend
        run: npm run build

      - name: Build Native Windows Executable (No Bundle)
        run: npx tauri build --no-bundle

      - name: Locate Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-exe"
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "build_script" } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Executable not found in src-tauri/target/release"
            exit 1
          }
          Write-Host "Located executable: $($exe.FullName)"
          Copy-Item $exe.FullName "dist-exe/yt-dlp-client.exe"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-client-windows-x64
          path: dist-exe/yt-dlp-client.exe
          if-no-files-found: error
