name: Build Native Windows App

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare Windows Binaries (yt-dlp and ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable_data"
          New-Item -ItemType Directory -Force -Path "downloads"
          
          # Download yt-dlp.exe
          Write-Host "Downloading latest yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "portable_data/yt-dlp.exe"
          Copy-Item "portable_data/yt-dlp.exe" "yt-dlp.exe"

          # Download static ffmpeg essentials build for Windows
          Write-Host "Downloading ffmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if ($ffmpegExe) {
            Copy-Item $ffmpegExe.FullName "portable_data/ffmpeg.exe"
            Copy-Item $ffmpegExe.FullName "ffmpeg.exe"
            Write-Host "FFmpeg extracted successfully."
          }

      - name: Build Web Frontend
        run: npm run build

      - name: Build Native Windows App (Tauri)
        run: npx tauri build

      - name: Upload Windows Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Media-Downloader-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/yt-dlp-client.exe
          draft: false
          prerelease: false
          generate_release_notes: true
