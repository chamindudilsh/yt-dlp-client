[package]
name = "yt-dlp-client"
version = "1.4.0"
description = "Native, lightweight Windows desktop client for yt-dlp, FFmpeg, and ffprobe"
authors = ["Chamindu Dilshan"]
license = "MIT"
homepage = "https://ytdlpc.chamindu.lk"
repository = "https://github.com/chamindudilsh/yt-dlp-client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "process"] }
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"


